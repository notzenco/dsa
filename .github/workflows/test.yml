name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Check for invalid escape sequences
        run: |
          cd by-language/python
          python -W error::SyntaxWarning -m compileall -q -f data_structures algorithms tests

      - name: Run Python tests
        run: |
          cd by-language/python
          pytest tests/ -v --cov=data_structures --cov=algorithms --cov-report=term-missing

  c-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build and run C tests
        run: |
          cd by-language/c
          make test

      - name: Run C tests with AddressSanitizer and UBSan
        run: |
          cd by-language/c
          make -B test \
            CFLAGS='-Wall -Wextra -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I.' \
            LDFLAGS='-fsanitize=address,undefined'

  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: |
          cd by-language/rust
          cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cd by-language/rust
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: |
          cd by-language/rust
          cargo test --workspace --all-features

      - name: Check no_std build
        run: |
          cd by-language/rust
          cargo check --workspace --no-default-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cd by-language/rust
          cargo doc --workspace --no-deps

  rust-msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.70 (declared rust-version)
        uses: dtolnay/rust-toolchain@1.70

      - name: Check library crates
        run: |
          cd by-language/rust
          cargo check -p dsa-core -p dsa-data-structures -p dsa-algorithms --lib

  go-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', 'stable']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting
        if: matrix.go-version == 'stable'
        run: |
          cd by-language/go
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: |
          cd by-language/go
          go vet ./...

      - name: Run Go tests
        run: |
          cd by-language/go
          go test -race ./...

  typescript-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd by-language/typescript
          bun install --frozen-lockfile

      - name: Type-check
        run: |
          cd by-language/typescript
          bun run typecheck

      - name: Run TypeScript tests
        run: |
          cd by-language/typescript
          bun test

  java-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Java tests
        run: |
          cd by-language/java
          ./gradlew test
